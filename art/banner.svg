<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glow-left" cx="25%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-right" cx="75%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Logo Gradients -->
    <linearGradient id="v-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="v-secondary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="v-facet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="badge-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>

    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Dot Pattern -->
    <pattern id="grid-dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .brand-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 64px;
      letter-spacing: -0.03em;
    }
    .brand-tagline {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 500;
      font-size: 13px;
      fill: #cbd5e1;
    }
    .sub-desc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 400;
      font-size: 15px;
      fill: #64748b;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="380" fill="url(#bg)" />

  <!-- Ambient Light Effects -->
  <rect width="1200" height="380" fill="url(#glow-left)" />
  <rect width="1200" height="380" fill="url(#glow-right)" />

  <!-- Dot Matrix Grid Overlay -->
  <rect width="1200" height="380" fill="url(#grid-dots)" />

  <!-- Subtle Border outline -->
  <rect x="1" y="1" width="1198" height="378" rx="16" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Inner Decorative Speed Lines -->
  <path d="M 0 320 Q 300 280 600 340 T 1200 300" fill="none" stroke="#4f46e5" stroke-width="1" opacity="0.15" />
  <path d="M 0 340 Q 400 310 800 360 T 1200 330" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.1" />

  <!-- BRAND LOGO MARK (Transformed and Centered-left) -->
  <g transform="translate(130, 95)">
    <!-- Glow -->
    <g filter="url(#logo-glow)" opacity="0.4">
      <path d="M40 30 L95 155 L150 30 L120 30 L95 95 L70 30 Z" fill="#6366f1" />
    </g>

    <!-- Outer shield backdrop -->
    <rect x="0" y="0" width="190" height="190" rx="42" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" />

    <!-- Left Wing Blade -->
    <path d="M38 35 L95 155 L77 155 L24 45 C22 41 25 35 30 35 Z" fill="url(#v-primary)" />

    <!-- Right Wing Blade -->
    <path d="M152 35 L95 155 L113 155 L166 45 C168 41 165 35 160 35 Z" fill="url(#v-secondary)" />

    <!-- Center Sharp Facet -->
    <path d="M64 35 L95 105 L126 35 L107 35 L95 65 L83 35 Z" fill="url(#v-facet)" />

    <!-- Lower Prism Core -->
    <polygon points="95,105 80,140 95,155 110,140" fill="#4338ca" opacity="0.9" />

    <!-- Accent Dots -->
    <circle cx="95" cy="27" r="2.5" fill="#38bdf8" />
  </g>

  <!-- TYPOGRAPHY SECTION -->
  <g transform="translate(370, 145)">
    <!-- Main Title -->
    <text x="0" y="0" class="brand-title" fill="url(#text-grad)">VELTRIX</text>
    
    <!-- Framework Tag -->
    <rect x="290" y="-48" width="118" height="26" rx="6" fill="#1e1b4b" stroke="url(#badge-border)" stroke-width="1" />
    <text x="349" y="-31" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" fill="#a5b4fc" text-anchor="middle" letter-spacing="0.06em">LARAVEL ADMIN</text>

    <!-- Tagline -->
    <text x="2" y="38" class="brand-tagline">
      <tspan fill="#38bdf8" font-weight="700">Familiar</tspan> to Build. <tspan fill="#a855f7" font-weight="700">Modern</tspan> by Design.
    </text>

    <!-- Short Mission Descriptor -->
    <text x="2" y="70" class="sub-desc">
      The high-velocity, secure, and modern successor to z-song/laravel-admin for Laravel 11, 12 &amp; 13.
    </text>

    <!-- Feature Pills / Badges -->
    <g transform="translate(0, 95)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="16" r="4" fill="#10b981" />
        <text x="28" y="20" class="badge-text">100% Familiar Syntax</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(192, 0)">
        <rect width="168" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="16" r="4" fill="#38bdf8" />
        <text x="28" y="20" class="badge-text">Zero-Build SSR UI</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(372, 0)">
        <rect width="188" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="16" r="4" fill="#f43f5e" />
        <text x="28" y="20" class="badge-text">CVE-2023-24249 Patched</text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(572, 0)">
        <rect width="154" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="16" r="4" fill="#a855f7" />
        <text x="28" y="20" class="badge-text">PHP 8.2 - 8.5 Ready</text>
      </g>
    </g>
  </g>
</svg>
